费吹灰之力，迅速闯关，率先到达终点。", "作为一代拳王，他在巅峰时期号称 “不败王者” ，三下五除二就击倒了对手。", "记者获悉，这家俱乐部引进外籍球员的事还在报价阶段，加盟八字没一撇呢。", "为了保证比赛的公平性，八分之一决赛唱对台戏，四个队两场比赛同时进行。"]}, {"cat": "熟语", "q": "下列各句中加点成语的使用，不正确的一项是（ ) [cite: 916]", "options": ["这支球队新赛季主力阵容终于亮相，未来成绩如何，众说纷纭，见仁见智。", "发令枪一响，运动员们就像离弦的箭一样飞快冲出去，竞争场面触目惊心。", "在农民趣味运动会中， “赶着大鹅奔小康” 的比赛别开生面，格外引人注目。", "体育营销要以心理效应为主，长期努力才能实现各种收益，不能一蹴而就。"]}, {"cat": "熟语", "q": "下列各句中加点熟语的使用，不正确的一项是（ ) [cite: 722]", "options": ["在决赛前的恳谈会上，队员们打开天窗说亮话，总结了技战术方面的一些弱点。", "赛事营销要放长线，钓大鱼，一份长期稳定的合约无疑能给双方带来更多好处。", "对方谈判代表总是闪烁其词，当面锣，对面鼓，让人捉摸不透他们的真实意图。", "羊毛出在羊身上，这些球星通过一些商业活动，很快赚回俱乐部高昂的转会费。"]}, {"cat": "熟语", "q": "下列各句中加点成语的使用，不正确的一项是（ ） [cite: 726]", "options": ["精神追求与身体实践的兼容并蓄，蕴含着中国博大精深的传统体育文化理念。", "昔日活跃于街头巷尾的传统体育项目在城市化的进程中销声匿迹，令人担忧。", "在任今天的足球比赛中，他是第一个进球的始作俑者，突显出名将的迷人风采。", "最终，她凭着坚定的意志和自信心，力挽狂澜，为全队夺冠立下了汗马功劳。"]}, {"cat": "熟语", "q": "下列各句中加点熟语的使用，不正确的一项是（ ） [cite: 773]", "options": ["这是我每天回家的路，太熟悉了，闭着眼睛捉麻雀，天再黑也不会走错。", "冰冻三尺非一日之寒，看这姿势就知道他练习滑雪已不是一天两天了。", "妈妈回来一看，妹妹正坐在地上嚎啕大哭，不分青红皂白就把我说了一顿。", "我们三个人呢，怎么可能辩不过他一个?你不要长他人志气灭自家威风!"]}, {"cat": "熟语", "q": "下列各句中加点成语的使用，不正确的一项是（ ） [cite: 778]", "options": ["冰墩墩在冬奥会上可谓名副其实的“社交利器”，获得全世界的关注和喜爱。", "北京冬残奧会即将开幕，中国体育代表团近百名运动员厉兵秣马，整装待发。", "“开学第一课”上，同学们观看了女足亚洲杯夺冠的视频片段，纷纷拍手称快。", "最近这部热播剧的片尾音乐如泣如诉，温情而深沉，听得人禁不住热泪盈眶。"]}, {"cat": "熟语", "q": "下列各句中加点熟语的使用，不正确的一项是（ ）", "options": ["单位给他涨工资了，他却洋洋得意地说了些漂亮话，真是得了便宜还卖乘!", "有那么一些人做起事情来总是前怕狼,后怕虎，顾虑太多，结果一事无成。", "比赛中出现的失误反而让观众记住了他的名字，他这是捡了芝麻，丢了西瓜。", "不入虎穴，焉得虎子?要想取得成功，就要有敢闯敢拼、不怕困难的奋斗精神。"]}, {"cat": "熟语", "q": "下列各句中加点成语的使用，不正确的一项是（ ）", "options": ["北京冬奥会成功举办后不到一年的时间里，冰雪运动在全国各地已经蔚然成风。", "在现场观众捶胸顿足的背后，不知凝聚了运动员们多少个日日夜夜的辛勤付出。", "正在举行的全国两会上，委员们就如何加快建设体育强国各抒己见，献计献策。", "参加此次世界杯的五位中国选手在首轮比赛中都旗开得胜，顺利晋级第二阶段。"]}, {"cat": "病句", "q": "下列句子中，有语病的一项是（ ） [cite: 921]", "options": ["他表示，将在隔离的14天里进行室内训练，然后回到球场，打好每一场比赛。", "英超联赛如果跟随政府的防疫思路，本赛季、甚至下个赛季的比赛都会受影响。", "为期三天的展会，将展演各种有地方特色的传统体育活动，展现传统体育魅力。", "体育所包含的价值观念、精神状态以及文化认知等，一定都会随着时代的变化。"]}, {"cat": "病句", "q": "下列句子中，有语病的一项是（ ） [cite: 731]", "options": ["如何运用人工智能技术发展体育事业，是每个体育工作者必须思考的大问题。", "你知不知道，体育比赛不仅关乎个人，而更多的是关乎团队甚至国家民族吗？", "马拉松赛的仪式除了具备一般体育赛事的组织特征，还具有自己的文化特征。", "赛会的发展，明星的效应，品牌的塑造，都因体育传播产生巨大的商业价值。"]}, {"cat": "病句", "q": "下列句子中，有语病的一项是（ ） [cite: 783]", "options": ["冬奥原创交响组曲《冰雪相约》，构思巧妙，气势磅礴，听起来令人心潮澎湃。", "这部电影展示了不少既精彩又惊险的滑雪场面，比如U型池比赛、障碍追逐等。", "奥林匹克运动诞生伊始，就承载着人类对“和平、团结、进步”的美好追求。", "奥运场馆中那些以奉献成就精彩的志愿者，成为普通民众参与奥运的重要形式。"]}, {"cat": "病句", "q": "下列句子中，有语病的一项是（ ）", "options": ["随着春节假期的逐渐临近，全球各地旅游相关行业都在热切期待着中国游客的到来。", "运动健身不仅是身体免疫力和生活质量的重要途径，也是建设健康中国的必然要求。", "龙舟、围棋和太极拳等中华传统体育项目已走出国门，向世界展示中华文化的智慧。", "现在，人们对运动的个性化需求不断增加，像马术这类小众项目也越来越受到行睐。"]}, {"cat": "病句", "q": "下列句子中，有语病的一项是（ ）", "options": ["坚持体育锻炼有助于保持心理健康，降低患神经退行性疾病的风险。", "针对老人、小孩及生活不能自理者，使用本产品时应有成年人看护。", "在较粗组织损伤的慢性期，热敷有一定地缓解疼痛，促进恢复的效果。", "以不确定、叠加、纠缠等为特征的量子是一种崭新的思维方式。"]}];
const cats = ["全部", ...new Set(bank.map(item => item.cat))];
let cat = "全部";
let index = 0;
const catBox = document.querySelector("#cats");
const card = document.querySelector("#card");
function list(){ return bank.filter(item => cat === "全部" || item.cat === cat); }
function renderCats(){
  catBox.innerHTML = cats.map(name => `<button class="${name===cat?"active":""}" data-cat="${name}">${name}</button>`).join("");
  catBox.querySelectorAll("button").forEach(button => button.onclick = () => { cat = button.dataset.cat; index = 0; render(); });
}
function render(){
  renderCats();
  const items = list();
  const item = items[index];
  if (!item) { card.textContent = "这个分类没有题目。"; return; }
  card.innerHTML = `<p>${item.cat} · ${index + 1} / ${items.length}</p><h2>${item.q}</h2>` +
    item.options.map(option => `<button class="opt">${option}</button>`).join("") +
    `<p><button id="prev">上一题</button> <button id="next">下一题</button></p><p id="msg"></p>`;
  card.querySelectorAll(".opt").forEach(button => button.onclick = () => {
    card.querySelectorAll(".opt").forEach(node => node.classList.remove("pick"));
    button.classList.add("pick");
    card.querySelector("#msg").textContent = "已记录选择。这批公开题目没有标准答案。";
  });
  card.querySelector("#prev").onclick = () => { index = (index - 1 + items.length) % items.length; render(); };
  card.querySelector("#next").onclick = () => { index = (index + 1) % items.length; render(); };
}
render();
</script>
