<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>体育生语文智能学习</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="phone">
    <div class="nav" id="nav-title">语文助手</div>
    <section class="screen active" data-screen="home" id="home"></section>
    <section class="screen" data-screen="exercise" id="exercise"></section>
    <section class="screen" data-screen="practice" id="practice"></section>
    <section class="screen" data-screen="chat" id="chat">
      <div class="chat">
        <div class="msgs" id="messages"></div>
        <form class="composer" id="chat-form">
          <input id="chat-input" placeholder="问一个词语或成语" />
          <button type="submit" id="send">发送</button>
        </form>
      </div>
    </section>
    <section class="screen" data-screen="profile" id="profile"></section>
    <section class="screen" data-screen="record" id="record"></section>
    <section class="screen" data-screen="report" id="report"></section>
    <section class="screen" data-screen="login" id="login"></section>
    <nav class="tabbar">
      <button data-tab="home" class="active"><img src="tabbar/home.png" alt="" />首页</button>
      <button data-tab="exercise"><img src="tabbar/exercise.png" alt="" />练习</button>
      <button data-tab="chat"><img src="tabbar/chat.png" alt="" />答疑</button>
      <button data-tab="profile"><img src="tabbar/profile.png" alt="" />我的</button>
    </nav>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
